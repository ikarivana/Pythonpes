{% extends 'home/base.html' %}

{% block content %}
<div class="container py-5" style="max-width: 500px;">
    <div class="card shadow-sm p-4 text-center" style="border-radius: 20px; background: #fdfaf4; border: 1px solid rgba(197, 160, 89, 0.2);">
        <h2 class="fw-bold mb-4" style="color: #3e2723;">Smazat článek?</h2>
        <p>Opravdu chcete nenávratně smazat článek <strong>"{{ clanek.titulek }}"</strong>?</p>
        
        <form method="post" class="mt-4">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger fw-bold px-4" style="border-radius: 12px;">
                Ano, smazat článek
            </button>
            <a href="{% url 'blog_detail' clanek.slug %}" class="btn btn-outline-secondary fw-bold px-4" style="border-radius: 12px;">
                Zrušit
            </a>
        </form>
    </div>
</div>
{% endblock %}
