{% extends 'home/base.html' %}

{% block content %}
<meta name="referrer" content="always">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
    :root {
        --mid-brown: #3e2723;
        --gold: #c5a059;
        --danger-red-dark: #8b0000;
        --search-red-bright: #ff0000;
        --border-tan: #e0d7d0;
    }

    #map {
        height: 600px !important;
        width: 100%;
        border-radius: 20px;
        border: 2px solid var(--border-tan);
        z-index: 1;
    }

    /* --- SOS ŠPENDLÍK (Animace) --- */
    .sos-marker-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        filter: drop-shadow(0 0 6px rgba(255, 0, 0, 0.6));
    }
    .sos-marker-circle {
        width: 38px; height: 38px;
        background-color: var(--search-red-bright);
        border: 3px solid white;
        border-radius: 50%;
        display: flex; justify-content: center; align-items: center;
        color: white; font-size: 18px;
        animation: sos-pulse-animation 1.5s infinite;
    }
    .sos-marker-arrow {
        width: 0; height: 0;
        border-left: 9px solid transparent; border-right: 9px solid transparent;
        border-top: 12px solid var(--search-red-bright);
        margin-top: -3px;
    }
    @keyframes sos-pulse-animation {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
        50% { transform: scale(1.1); box-shadow: 0 0 0 12px rgba(255, 0, 0, 0); }
        100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
    }

    /* OSTATNÍ ŠPENDLÍKY */
    .custom-marker { display: flex; flex-direction: column; align-items: center; }
    .marker-dot {
        width: 30px; height: 30px; border-radius: 50%; border: 2px solid white;
        display: flex; justify-content: center; align-items: center; color: white;
        box-shadow: 0 3px 6px rgba(0,0,0,0.3);
    }
    .marker-tip-small {
        width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; margin-top: -1px;
    }

    /* FILTRY */
    .badge-filter {
        padding: 10px 18px; border-radius: 50px; font-size: 0.85rem; color: white;
        border: none; cursor: pointer; transition: 0.3s; font-weight: 600; white-space: nowrap;
    }
    .pulse-search {
        background-color: var(--search-red-bright) !important;
        animation: pulse-btn 1.5s infinite;
        border: 2px solid white !important;
    }
    @keyframes pulse-btn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
</style>

<div class="container-fluid mt-3">
    <div class="row">
        <div class="col-12">
            <div class="p-3 p-md-4 bg-white" style="border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="m-0" style="font-size: clamp(1.2rem, 4vw, 1.8rem);">📍 Interaktivní mapa</h2>
                    <a href="{% url 'pridat_sluzbu' %}" class="badge-filter" style="background-color: var(--gold); text-decoration: none;">
                        <i class="fas fa-plus-circle"></i> PŘIDAT NA MAPU
                    </a>
                </div>

                <div class="d-flex flex-wrap gap-2 mb-3">
                    <button class="badge-filter" style="background-color: var(--mid-brown);" onclick="filtrujMapu('vse')">Vše</button>
                    <button class="badge-filter pulse-search" onclick="filtrujMapu('ztrata')">🚨 HLEDÁ SE!</button>
                    <button class="badge-filter" style="background-color: var(--danger-red-dark);" onclick="filtrujMapu('nebezpeci')">⚠️ NEBEZPEČÍ</button>
                    <button class="badge-filter" style="background-color: #212121;" onclick="filtrujMapu('veterina')">🩺 Veterina</button>
                    <button class="badge-filter" style="background-color: #00bcd4;" onclick="filtrujMapu('strihani')">✂️ Salóny</button>
                    <button class="badge-filter" style="background-color: #1976d2;" onclick="filtrujMapu('obchod')">🛍️ Obchody</button>
                    <button class="badge-filter" style="background-color: #f57c00;" onclick="filtrujMapu('hotel')">🏠 Hotely</button>
                    <button class="badge-filter" style="background-color: #388e3c;" onclick="filtrujMapu('wellness')">🌊 Wellness</button>
                    <button class="badge-filter" style="background-color: #7b1fa2;" onclick="filtrujMapu('cvicak')">🎾 Výcvik</button>
                    <button class="badge-filter" style="background-color: #9e9e9e;" onclick="filtrujMapu('utulek')">🏘️ Útulky</button>
                    <button class="badge-filter" style="background-color: var(--gold);" onclick="filtrujMapu('chovna_stanice')">✨ Chovné stanice</button>
                </div>

                <div id="map" style="min-height: 400px; height: 70vh !important;"></div>

                <div class="mt-4 p-3 text-center" style="background-color: #fcfaf8; border-radius: 15px; border: 1px solid var(--border-tan);">
                    <p class="m-0" style="color: #6d4c41; font-size: 0.85rem;">
                        <i class="fas fa-info-circle" style="color: var(--gold);"></i>
                        Vložená data pocházejí z <strong>veřejně dostupných informačních zdrojů</strong>.
                        Pokud si přejete údaje upravit nebo odstranit, prosíme,
                        <a href="elivdruhy@gmail.com" style="color: var(--mid-brown); font-weight: bold; text-decoration: underline;">kontaktujte nás</a>.
                    </p>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var sluzby = {{ sluzby_json|default:"[]"|safe }};
    var allMarkers = [];
    var map;

    var configMap = {
        'ztrata': { color: '#ff0000', icon: 'fa-bell' },
        'nebezpeci': { color: '#8b0000', icon: 'fa-triangle-exclamation' },
        'veterina': { color: '#212121', icon: 'fa-stethoscope' },
        'strihani': { color: '#00bcd4', icon: 'fa-scissors' },
        'obchod': { color: '#1976d2', icon: 'fa-shopping-bag' },
        'hotel': { color: '#f57c00', icon: 'fa-house' },
        'wellness': { color: '#388e3c', icon: 'fa-water' },
        'cvicak': { color: '#7b1fa2', icon: 'fa-dumbbell' },
        'utulek': { color: '#9e9e9e', icon: 'fa-hotel' },
        'chovna_stanice': { color: '#c5a059', icon: 'fa-certificate' }
    };

    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const urlLat = parseFloat(String(urlParams.get('lat') || '').replace(',', '.'));
        const urlLon = parseFloat(String(urlParams.get('lon') || '').replace(',', '.'));
        const urlZoom = parseInt(urlParams.get('zoom')) || 12;

        let startPos = [49.8, 15.5];
        let startZoom = 7;

        if (!isNaN(urlLat) && !isNaN(urlLon)) {
            startPos = [urlLat, urlLon];
            startZoom = urlZoom;
        }

        map = L.map('map').setView(startPos, startZoom);

        L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        setTimeout(function() {
            map.invalidateSize();
            if (!isNaN(urlLat)) map.panTo([urlLat, urlLon]);
        }, 300);

        sluzby.forEach(function(s) {
            var lat = parseFloat(String(s.lat).replace(',', '.'));
            var lon = parseFloat(String(s.lon).replace(',', '.'));

            if (isNaN(lat) || isNaN(lon)) return;

            var conf = configMap[s.typ_slug] || { color: '#3e2723', icon: 'fa-map-marker-alt' };
            var markerIcon;

            if (s.typ_slug === 'ztrata') {
                markerIcon = L.divIcon({
                    html: `<div class="sos-marker-wrapper pulse"><div class="sos-marker-circle" style="background-color: ${conf.color};"><i class="fas ${conf.icon}"></i></div><div class="sos-marker-arrow"></div></div>`,
                    className: '', iconSize: [40, 52], iconAnchor: [20, 52], popupAnchor: [0, -52]
                });
            } else {
                markerIcon = L.divIcon({
                    html: `<div class="custom-marker"><div class="marker-dot" style="background-color: ${conf.color};"><i class="fas ${conf.icon}" style="font-size: 13px; color: white;"></i></div><div class="marker-tip-small" style="border-top: 8px solid ${conf.color};"></div></div>`,
                    className: '', iconSize: [30, 38], iconAnchor: [15, 38], popupAnchor: [0, -38]
                });
            }

            var marker = L.marker([lat, lon], { icon: markerIcon }).addTo(map);

            var popupHtml = `
                <div style="min-width:160px;">
                    <b style="color:#3e2723;">${s.nazev}</b><br>
                    <small style="color:#c5a059; font-weight:bold;">${s.typ}</small><br>
                    <div style="margin-top:5px; font-size: 0.85rem;">📍 ${s.adresa || 'Poloha GPS'}</div>
                    <a href="${s.url}" style="display:block; background:#3e2723; color:white; text-align:center; padding:5px; border-radius:8px; margin-top:8px; text-decoration:none; font-size:0.8rem; font-weight:bold;">ZOBRAZIT DETAIL</a>
                </div>`;
            marker.bindPopup(popupHtml);

            if (!isNaN(urlLat) && Math.abs(lat - urlLat) < 0.01 && Math.abs(lon - urlLon) < 0.01) {
                setTimeout(function() {
                    marker.openPopup();
                }, 800);
            }

            allMarkers.push({ instance: marker, typ: s.typ_slug });
        });

        if (!isNaN(urlLat) && !isNaN(urlLon)) {
            filtrujMapu('ztrata');
        }
    });

    function filtrujMapu(kategorie) {
        allMarkers.forEach(function(m) {
            if (kategorie === 'vse' || m.typ === kategorie) map.addLayer(m.instance);
            else map.removeLayer(m.instance);
        });
    }
</script>
{% endblock %}
