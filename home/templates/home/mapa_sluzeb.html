{% extends 'home/base.html' %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
    :root {
        --mid-brown: #3e2723;
        --gold: #c5a059;
        --danger-red-dark: #8b0000;
        --search-red-bright: #ff0000;
        --border-tan: #e0d7d0;
    }

    #map {
        height: 600px !important;
        width: 100%;
        border-radius: 20px;
        border: 2px solid var(--border-tan);
        z-index: 1;
    }

    /* SPECIÁLNÍ SOS ŠPENDLÍK (Ten přidaný, co se ztratil) */
    .sos-marker-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        filter: drop-shadow(0 0 6px rgba(255, 0, 0, 0.6));
    }

    .sos-marker-circle {
        width: 38px;
        height: 38px;
        background-color: var(--search-red-bright);
        border: 3px solid white;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 18px;
        animation: sos-pulse-animation 1.5s infinite;
    }

    .sos-marker-arrow {
        width: 0;
        height: 0;
        border-left: 9px solid transparent;
        border-right: 9px solid transparent;
        border-top: 12px solid var(--search-red-bright);
        margin-top: -3px;
    }

    @keyframes sos-pulse-animation {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
        50% { transform: scale(1.1); box-shadow: 0 0 0 12px rgba(255, 0, 0, 0); }
        100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
    }

    /* OSTATNÍ KLASICKÉ ŠPENDLÍKY */
    .custom-marker {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .marker-dot {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid white;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .marker-tip-small {
        width: 0;
        height: 0;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        margin-top: -1px;
    }

    .badge-filter {
        padding: 10px 18px;
        border-radius: 50px;
        font-size: 0.85rem;
        color: white;
        border: none;
        cursor: pointer;
        transition: 0.3s;
        font-weight: 600;
        white-space: nowrap;
    }

    .pulse-search {
        background-color: var(--search-red-bright) !important;
        animation: pulse-btn 1.5s infinite;
        border: 2px solid white !important;
    }

    @keyframes pulse-btn {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }

    .btn-call {
        display: block;
        text-align: center;
        padding: 10px;
        border-radius: 10px;
        text-decoration: none;
        margin-top: 10px;
        font-weight: 800;
        font-size: 0.85rem;
        text-transform: uppercase;
    }
</style>

<div class="p-4 bg-white" style="border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
    <h2 class="map-title mb-2">📍 Interaktivní mapa</h2>

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div class="d-flex flex-wrap gap-2">
            <button class="badge-filter" style="background-color: var(--mid-brown);" onclick="filtrujMapu('vse')">Vše</button>
            <button class="badge-filter pulse-search" onclick="filtrujMapu('ztrata')">🚨 HLEDÁ SE!</button>
            <button class="badge-filter" style="background-color: var(--danger-red-dark);" onclick="filtrujMapu('nebezpeci')">⚠️ NEBEZPEČÍ</button>
            <button class="badge-filter" style="background-color: #212121;" onclick="filtrujMapu('veterina')">🩺 Veterina</button>
            <button class="badge-filter" style="background-color: #00bcd4;" onclick="filtrujMapu('strihani')">✂️ Salóny / Stříhání</button>
            <button class="badge-filter" style="background-color: #1976d2;" onclick="filtrujMapu('obchod')">🛍️ Obchody</button>
            <button class="badge-filter" style="background-color: #f57c00;" onclick="filtrujMapu('hotel')">🏠 Hotely</button>
            <button class="badge-filter" style="background-color: #388e3c;" onclick="filtrujMapu('wellness')">🌊 Wellness</button>
            <button class="badge-filter" style="background-color: #7b1fa2;" onclick="filtrujMapu('cvicak')">🎾 Výcvik</button>
            <button class="badge-filter" style="background-color: #9e9e9e;" onclick="filtrujMapu('utulek')">🏘️ Útulky</button>
            <button class="badge-filter" style="background-color: var(--gold); color: white;" onclick="filtrujMapu('chovna_stanice')">✨ Chovné stanice</button>
        </div>
    </div>

    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var sluzby = {{ sluzby_json|safe }};
    var allMarkers = [];
    var map;

    // KONFIGURACE BAREV A IKONEK
    var configMap = {
        'ztrata': { color: '#ff0000', icon: 'fa-bell' },
        'nebezpeci': { color: '#8b0000', icon: 'fa-triangle-exclamation' },
        'veterina': { color: '#212121', icon: 'fa-stethoscope' },
        'strihani': { color: '#00bcd4', icon: 'fa-scissors' },
        'obchod': { color: '#1976d2', icon: 'fa-shopping-bag' },
        'hotel': { color: '#f57c00', icon: 'fa-house-dog' },
        'wellness': { color: '#388e3c', icon: 'fa-water' },
        'cvicak': { color: '#7b1fa2', icon: 'fa-table-tennis-paddle-ball' },
        'utulek': { color: '#9e9e9e', icon: 'fa-hotel' },
        'chovna_stanice': { color: '#c5a059', icon: 'fa-star' }
    };

    document.addEventListener('DOMContentLoaded', function() {
        map = L.map('map').setView([49.8, 15.5], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);

        sluzby.forEach(function(s) {
            var lat = parseFloat(s.lat);
            var lon = parseFloat(s.lon);

            if (!isNaN(lat) && !isNaN(lon)) {
                var conf = configMap[s.typ_slug] || { color: '#3e2723', icon: 'fa-map-marker-alt' };
                var marker;

                // ROZHODNUTÍ O TYPU ŠPENDLÍKU
                if (s.typ_slug === 'ztrata') {
                    // Ten velký přidaný špendlík pro Izzabelu
                    var sosIcon = L.divIcon({
                        html: `
                            <div class="sos-marker-wrapper">
                                <div class="sos-marker-circle"><i class="fas ${conf.icon}"></i></div>
                                <div class="sos-marker-arrow"></div>
                            </div>`,
                        className: 'dummy',
                        iconSize: [40, 52],
                        iconAnchor: [20, 52],
                        popupAnchor: [0, -52]
                    });
                    marker = L.marker([lat, lon], { icon: sosIcon }).addTo(map);
                } else {
                    // Klasický barevný špendlík pro ostatní
                    var classicIcon = L.divIcon({
                        html: `
                            <div class="custom-marker">
                                <div class="marker-dot" style="background-color: ${conf.color};">
                                    <i class="fas ${conf.icon}" style="font-size: 13px;"></i>
                                </div>
                                <div class="marker-tip-small" style="border-top: 8px solid ${conf.color};"></div>
                            </div>`,
                        className: 'dummy',
                        iconSize: [30, 38],
                        iconAnchor: [15, 38],
                        popupAnchor: [0, -38]
                    });
                    marker = L.marker([lat, lon], { icon: classicIcon }).addTo(map);
                }

                var isZtrata = (s.typ_slug === 'ztrata');
                var popupHtml = `
                    <div style="min-width:180px; ${isZtrata ? 'border: 3px solid red; padding: 10px; border-radius: 12px;' : ''}">
                        <b style="color: ${isZtrata ? 'red' : 'var(--mid-brown)'}; display: block; font-size: 1rem;">${isZtrata ? '🚨 HLEDÁ SE: ' : ''}${s.nazev}</b>
                        <span style="color: var(--gold); font-size: 0.7rem; font-weight: 800; text-transform: uppercase;">${s.typ}</span>
                        <div style="margin: 8px 0; font-size: 0.85rem; color: #555;">📍 ${s.adresa}</div>
                        ${s.url ? `<a href="${s.url}" class="btn-call" style="background: ${isZtrata ? '#ff0000' : 'var(--mid-brown)'}; color: white;">${isZtrata ? 'POMOCT NAJÍT' : 'DETAIL'}</a>` : ''}
                    </div>
                `;

                marker.bindPopup(popupHtml);
                allMarkers.push({ instance: marker, typ: s.typ_slug });
            }
        });
        setTimeout(function() { map.invalidateSize(); }, 300);
    });

    function filtrujMapu(kategorie) {
        allMarkers.forEach(function(item) {
            if (kategorie === 'vse' || item.typ === kategorie) { map.addLayer(item.instance); }
            else { map.removeLayer(item.instance); }
        });
    }
</script>
{% endblock %}
