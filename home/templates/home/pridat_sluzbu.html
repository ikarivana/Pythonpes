{% extends 'home/base.html' %}

{% block content %}
<style>
    :root {
        --border-tan: #e2d1c3;
    }

    #map-picker {
        height: 600px !important;
        min-height: 400px;
        width: 100%;
        display: block;
        border-radius: 25px;
        border: 2px solid var(--border-tan);
        z-index: 1;
    }

    /* Stylování Django formuláře */
    #map-form p {
        margin-bottom: 15px;
    }

    #map-form input, #map-form select, #map-form textarea {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: 1.5px solid var(--border-tan);
        background: #fff;
        transition: 0.3s;
    }

    #map-form input:focus {
        border-color: var(--gold);
        outline: none;
        box-shadow: 0 0 10px rgba(197, 160, 89, 0.1);
    }

    .gps-visible {
        display: block !important;
        background-color: #fffdf5 !important;
        border: 2px solid var(--gold) !important;
        padding: 15px;
        border-radius: 15px;
        margin-top: 10px;
    }

    .btn-gps {
        background: white;
        border: 2px solid var(--mid-brown);
        color: var(--mid-brown);
        border-radius: 12px;
        padding: 10px;
        transition: 0.3s;
        width: 100%;
    }

    .btn-gps:hover {
        background: var(--mid-brown);
        color: white;
    }

    .form-card {
        border-radius: 25px;
        border: none;
        background: white;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .section-title {
        color: var(--mid-brown);
        font-family: 'Playfair Display', serif;
        font-weight: 800;
    }
</style>

<div class="container-fluid mt-4">
    <div class="d-flex align-items-center mb-4">
        <a href="{% url 'mapa_sluzeb' %}" class="text-decoration-none me-3" style="color: var(--mid-brown);">
            <i class="fas fa-arrow-left fa-lg"></i>
        </a>
        <h2 class="mb-0 section-title">📍 Přidat místo na mapu</h2>
    </div>

    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card form-card p-4">
                <p class="text-muted small mb-3">Pomozte ostatním páníčkům najít skvělá místa nebo je varujte před nebezpečím.</p>

                <button type="button" class="btn-gps mb-4 fw-bold" onclick="najdiMne()">
                    <i class="fas fa-location-arrow me-2"></i> Použít moji aktuální polohu
                </button>

                <form method="post" id="map-form">
                    {% csrf_token %}
                    <div id="form-fields-container">
                        {{ form.as_p }}
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn fw-bold flex-grow-1 py-3" style="background-color: var(--gold); color: var(--dark-cocoa); border-radius: 15px;">
                            ZVEŘEJNIT NA MAPĚ
                        </button>
                        <a href="{% url 'mapa_sluzeb' %}" class="btn d-flex align-items-center px-4" style="border: 1.5px solid var(--border-tan); border-radius: 15px; color: #8d7d77;">
                            Zrušit
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="card shadow-sm p-0" style="border-radius: 25px; overflow: hidden; border: none;">
                <div id="map-picker"></div>
            </div>
            <div class="mt-3 d-flex align-items-center justify-content-center gap-2 text-muted small">
                <i class="fas fa-info-circle text-gold"></i>
                <span>Klikněte do mapy pro ruční označení místa nebo přetáhněte značku.</span>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    var mapPicker;
    var marker;

    function ukazPoleSouradnic() {
        const latInput = document.getElementById('id_lat');
        const lonInput = document.getElementById('id_lon');
        if (latInput && lonInput) {
            latInput.closest('p').className = 'gps-visible';
            lonInput.closest('p').className = 'gps-visible';
            latInput.closest('p').style.display = 'block';
            lonInput.closest('p').style.display = 'block';
        }
    }

    function setCoords(lat, lon) {
        document.getElementById('id_lat').value = lat.toFixed(6);
        document.getElementById('id_lon').value = lon.toFixed(6);

        if (marker) {
            marker.setLatLng([lat, lon]);
        } else {
            // Použijeme tvou barvu pro marker (pokud máš vlastní ikonu, sem s ní)
            marker = L.marker([lat, lon], {draggable: true}).addTo(mapPicker);
            marker.on('dragend', function(e) {
                var pos = marker.getLatLng();
                setCoords(pos.lat, pos.lng);
            });
        }
    }

    function najdiMne() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(pos) {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                mapPicker.setView([lat, lon], 16);
                setCoords(lat, lon);
            }, function() {
                alert("Nepodařilo se získat polohu. Povolte prosím GPS v prohlížeči.");
            });
        }
    }

    function geokodujAdresu() {
        const adresa = document.getElementById('id_adresa').value;
        if (adresa.length > 5) {
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(adresa)}&limit=1`)
                .then(r => r.json())
                .then(data => {
                    if (data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);
                        mapPicker.setView([lat, lon], 16);
                        setCoords(lat, lon);
                    }
                });
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        mapPicker = L.map('map-picker').setView([49.8, 15.5], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(mapPicker);

        // Skrytí lat/lon polí v základu
        const latInput = document.getElementById('id_lat');
        const lonInput = document.getElementById('id_lon');
        if (latInput && lonInput) {
            latInput.closest('p').style.display = 'none';
            lonInput.closest('p').style.display = 'none';
        }

        {% if form.errors %}
            ukazPoleSouradnic();
        {% endif %}

        mapPicker.on('click', function(e) {
            setCoords(e.latlng.lat, e.latlng.lng);
        });

        // Naslouchání na změnu adresy pro automatické zaměření
        const adresaField = document.getElementById('id_adresa');
        if (adresaField) {
            adresaField.addEventListener('blur', geokodujAdresu);
        }

        setTimeout(() => { mapPicker.invalidateSize(); }, 400);
    });
</script>
{% endblock %}
