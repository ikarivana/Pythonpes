{% extends 'home/base.html' %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-page: #fdfaf5;
        --card-border: #eaddcf;
        --text-dark: #4a3728;
        --primary-brown: #8b5e3c;
        --gold-accent: #c5a059;
        --gold-light: #f9f1e7;
    }

    body { background-color: var(--bg-page); color: var(--text-dark); font-family: 'Plus Jakarta Sans', sans-serif; }
    .feed-container { max-width: 600px; margin: 0 auto; padding: 30px 20px; }

    .add-post-card {
        background: white; border-radius: 24px; padding: 30px;
        box-shadow: 0 10px 30px rgba(139, 94, 60, 0.08);
        border: 1px solid var(--card-border);
    }

    /* Styl pro textarea a inputy */
    .add-post-card textarea, .add-post-card input[type="text"], .add-post-card input[type="file"] {
        width: 100%;
        border: 1.5px solid var(--card-border) !important;
        background: #fafafa !important;
        border-radius: 18px !important;
        padding: 15px 20px !important;
        color: var(--text-dark);
        margin-bottom: 20px;
    }

    .add-post-card textarea { resize: none; min-height: 150px; }

    .add-post-card textarea:focus, .add-post-card input:focus {
        outline: none;
        border-color: var(--gold-accent) !important;
        background: white !important;
    }

    .btn-gold-action {
        background: linear-gradient(135deg, var(--gold-accent), var(--primary-brown));
        color: white; border: none; border-radius: 12px; padding: 12px 25px;
        font-weight: 700; box-shadow: 0 4px 15px rgba(139, 94, 60, 0.2);
        cursor: pointer; text-decoration: none;
    }

    .btn-outline-secondary {
        border-radius: 12px; padding: 12px 25px; font-weight: 700;
        border: 1px solid var(--card-border); color: var(--text-dark);
        background: white; text-decoration: none;
    }
</style>

<div class="feed-container">
    <div class="add-post-card">
        <h2 class="fw-bold mb-4" style="color: var(--primary-brown);">Upravit příspěvek</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label class="fw-bold mb-2">Text příspěvku:</label>
                {{ form.text }}
            </div>

            {% if prispevek.obrazek %}
                <div class="mb-3 text-center">
                    <p class="small text-muted">Současný obrázek:</p>
                    <img src="{{ prispevek.obrazek.url }}" style="max-height: 200px; border-radius: 15px;" class="shadow-sm">
                </div>
            {% endif %}

            <div class="mb-4">
                <label class="fw-bold mb-2">Změnit obrázek / nahrát nový:</label>
                {{ form.obrazek }}
            </div>

            {% if prispevek.video %}
                <div class="mb-3 text-center">
                    <p class="small text-muted">Současné video:</p>
                    <video controls style="max-height: 200px; border-radius: 15px;" class="shadow-sm">
                        <source src="{{ prispevek.video.url }}" type="video/mp4">
                    </video>
                </div>
            {% endif %}

            <div class="mb-4">
                <label class="fw-bold mb-2">Změnit video / nahrát nové:</label>
                {{ form.video }}
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn-gold-action">Uložit změny</button>
                <a href="{% url 'zed_plemene' prispevek.plemeno.slug %}" class="btn-outline-secondary">Zrušit</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
