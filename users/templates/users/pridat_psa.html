{% extends 'home/base.html' %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
    :root { --t-gold: #c5a059; --t-brown: #3e2723; --t-bg: #fdfaf4; --t-card-bg: #ffffff; }
    body { background-color: var(--t-bg); font-family: 'Plus Jakarta Sans', sans-serif; color: var(--t-brown); }
    .form-container { max-width: 900px; margin: 40px auto; padding: 0 15px; }
    .edit-card { position: relative; background: var(--t-card-bg); border-radius: 25px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid rgba(197, 160, 89, 0.1); overflow: hidden; }
    .section-title { font-size: 1.1rem; font-weight: 800; color: var(--t-brown); margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    .label-gold { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: var(--t-gold); display: block; margin-bottom: 5px; }
    .input-clean { width: 100%; border: 1px solid #eee; border-radius: 12px; padding: 12px 15px; font-size: 0.95rem; transition: 0.3s; background: #fff; }
    .btn-save-main { background: var(--t-brown); color: white; border: none; padding: 18px; border-radius: 20px; font-weight: 800; transition: 0.3s; cursor: pointer; border: 2px solid var(--t-gold); width: 100%; margin-top: 20px; }
</style>

<div class="form-container">
    <div class="text-center mb-5">
        <h2 class="fw-800 m-0">Nový profil pejska</h2>
        <p class="text-muted">Všechny údaje pro digitální vizitku</p>
    </div>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="edit-card">
            <h5 class="section-title"><i class="fas fa-dog me-2"></i>Základní informace</h5>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="label-gold">Jméno psa *</label>
                    <input type="text" name="jmeno" class="input-clean" required>
                </div>
                <div class="col-md-6">
                    <label class="label-gold">Rasa *</label>
                    <input type="text" name="rasa" class="input-clean" required>
                </div>
                <div class="col-md-6">
                    <label class="label-gold">Datum narozeni</label>
                    <input type="date" name="datum_narozeni" class="input-clean">
                </div>
                <div class="col-md-6">
                    <label class="label-gold">Číslo čipu</label>
                    <input type="text" name="cip" class="input-clean">
                </div>
                <div class="col-md-12">
                    <label class="label-gold">Profilová fotografie</label>
                    <input type="file" name="fotka" class="input-clean">
                </div>
            </div>
        </div>

        <div class="edit-card">
            <h5 class="section-title"><i class="fas fa-heartbeat me-2"></i>Zdravotní termíny a prevence</h5>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="label-gold">Poslední očkování</label>
                    <input type="date" name="posledni_ockovani" id="id_ocko_last" class="input-clean">
                </div>
                <div class="col-md-6">
                    <label class="label-gold">Příští očkování</label>
                    <input type="date" name="pristi_ockovani" id="id_ocko_next" class="input-clean">
                </div>
                <div class="col-md-6">
                    <label class="label-gold">Poslední odčervení</label>
                    <input type="date" name="posledni_odcerveni" id="id_odcerv_last" class="input-clean">
                </div>
                <div class="col-md-6">
                    <label class="label-gold">Příští odčervení</label>
                    <input type="date" name="pristi_odcerveni" id="id_odcerv_next" class="input-clean">
                </div>
                <div class="col-md-12">
                     <label class="label-gold">Ochrana proti klíšťatům (Typ a datum)</label>
                     <input type="text" name="typ_ochrany_klistata" class="input-clean" placeholder="Obojek / Pipeta - Datum">
                </div>
            </div>
        </div>

        <div class="edit-card">
            <h5 class="section-title"><i class="fas fa-certificate me-2"></i>Chovnost a původ</h5>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="label-gold">Bonitace</label>
                    <input type="text" name="bonitace" class="input-clean" placeholder="Kód bonitace">
                </div>
                <div class="col-md-6">
                    <label class="label-gold">Zdravotní testy</label>
                    <input type="text" name="zdravotni_testy" class="input-clean" placeholder="Locus, PRA, atd.">
                </div>
                <div class="col-md-6">
                    <label class="label-gold">Otec (manuálně)</label>
                    <input type="text" name="otec_manualni" class="input-clean">
                </div>
                <div class="col-md-6">
                    <label class="label-gold">Matka (manuálně)</label>
                    <input type="text" name="matka_manualni" class="input-clean">
                </div>
                <div class="col-md-6">
                    <label class="label-gold">Chovná stanice</label>
                    <input type="text" name="chovna_stanice" class="input-clean">
                </div>
                <div class="col-md-2">
                    <label class="label-gold">RTG HD</label>
                    <input type="text" name="rtg_hd" class="input-clean">
                </div>
                <div class="col-md-2">
                    <label class="label-gold">RTG ED</label>
                    <input type="text" name="rtg_ed" class="input-clean">
                </div>
                <div class="col-md-2">
                    <label class="label-gold">RTG Páteř</label>
                    <input type="text" name="rtg_pater" class="input-clean">
                </div>
            </div>
        </div>

        <button type="submit" class="btn-save-main shadow mb-5">
            <i class="fas fa-plus-circle me-2"></i> ZAREGISTROVAT PEJSKA
        </button>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const ockoLast = document.getElementById('id_ocko_last');
    const ockoNext = document.getElementById('id_ocko_next');
    const odcervLast = document.getElementById('id_odcerv_last');
    const odcervNext = document.getElementById('id_odcerv_next');

    if(ockoLast) {
        ockoLast.addEventListener('change', function() {
            if (this.value) {
                let date = new Date(this.value);
                date.setFullYear(date.getFullYear() + 1);
                ockoNext.value = date.toISOString().split('T')[0];
            }
        });
    }

    if(odcervLast) {
        odcervLast.addEventListener('change', function() {
            if (this.value) {
                let date = new Date(this.value);
                date.setMonth(date.getMonth() + 3);
                odcervNext.value = date.toISOString().split('T')[0];
            }
        });
    }
});
</script>
{% endblock %}
