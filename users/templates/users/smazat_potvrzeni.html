{% extends 'home/base.html' %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-page: #fdfaf5;
        --card-border: #eaddcf;
        --text-dark: #4a3728;
        --primary-brown: #8b5e3c;
        --gold-accent: #c5a059;
    }
    body { background-color: var(--bg-page) !important; color: var(--text-dark); font-family: 'Plus Jakarta Sans', sans-serif; }

    .feed-container { max-width: 450px; margin: 0 auto; padding: 80px 20px; }

    .delete-card {
        background: white;
        border-radius: 30px;
        padding: 40px;
        box-shadow: 0 20px 40px rgba(139, 94, 60, 0.1);
        border: 1px solid var(--card-border);
        text-align: center;
    }

    .icon-box {
        width: 80px;
        height: 80px;
        background: #fff5f5;
        color: #dc3545;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 25px;
        font-size: 2rem;
    }

    .btn-danger-custom {
        background: #dc3545; color: white; border: none;
        border-radius: 18px; padding: 15px; font-weight: 800;
        text-decoration: none; transition: 0.3s;
        border-bottom: 4px solid #b02a37;
    }
    .btn-danger-custom:hover { background: #c82333; transform: translateY(-2px); color: white; }

    .btn-cancel-custom {
        border-radius: 18px; padding: 15px; font-weight: 700;
        border: 2px solid var(--card-border); color: var(--text-dark);
        background: white; text-decoration: none; transition: 0.3s;
    }
    .btn-cancel-custom:hover { background: #f8f9fa; color: var(--primary-brown); }
</style>

<div class="feed-container">
    <div class="delete-card">
        <div class="icon-box">
            <i class="fas fa-trash-alt"></i>
        </div>

        <h2 class="fw-bold mb-3" style="color: var(--primary-brown);">Smazat příspěvek?</h2>
        <p class="text-muted mb-4">
            Tento krok je nevratný. Příspěvek i s jeho komentáři bude navždy odstraněn z vaší zdi.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="d-grid gap-3">
                <button type="submit" class="btn-danger-custom">
                    ANO, SMAZAT NAVŽDY
                </button>
                <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="btn-cancel-custom">
                    Zrušit a vrátit se
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
